<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Dad | A Cinematic Journey</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* ==========================================================================
       1. VARIABLES & RESET
       ========================================================================== */
    :root {
      --bg-dark: #050811;
      --bg-navy: #0a1128;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dark: #aa7c11;
      --text-main: #f0f4f8;
      --text-muted: #a0aec0;
      --glass-bg: rgba(10, 17, 40, 0.55);
      --glass-border: rgba(212, 175, 55, 0.25);
      --glass-glow: rgba(212, 175, 55, 0.15);
      --font-heading: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-accent: 'Great Vibes', cursive;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none; /* Custom cursor used */
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
    }

    body {
      overflow-x: hidden;
      position: relative;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--gold-dark);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold-primary);
    }

    /* ==========================================================================
       2. CANVAS & CURSOR OVERLAYS
       ========================================================================== */
    #bg-canvas, #fireworks-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }
    #fireworks-canvas {
      z-index: 99;
    }

    /* Custom Cursor */
    .custom-cursor {
      position: fixed;
      width: 10px;
      height: 10px;
      background: var(--gold-primary);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, background-color 0.2s;
    }
    .custom-cursor-follower {
      position: fixed;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease-out, width 0.2s, height 0.2s;
    }
    .cursor-hover .custom-cursor {
      width: 18px;
      height: 18px;
      background: var(--gold-light);
    }
    .cursor-hover .custom-cursor-follower {
      width: 50px;
      height: 50px;
      border-color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.05);
    }

    /* Mouse Glow Effect */
    .mouse-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      transform: translate(-50%, -50%);
    }

    /* Scroll Progress Indicator */
    .scroll-progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-primary), var(--gold-light));
      z-index: 10000;
      width: 0%;
      box-shadow: 0 0 10px var(--gold-primary);
    }

    /* ==========================================================================
       3. NAVIGATION & UI CONTROLS
       ========================================================================== */
    .top-nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      background: rgba(5, 8, 17, 0.4);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    }
    .nav-logo {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--gold-primary);
      letter-spacing: 2px;
    }
    .nav-controls {
      display: flex;
      gap: 15px;
    }
    .icon-btn {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--glass-border);
      color: var(--gold-primary);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .icon-btn:hover {
      background: var(--gold-primary);
      color: var(--bg-dark);
      box-shadow: 0 0 15px var(--gold-primary);
    }

    /* Floating Scroll Top Button */
    .scroll-top-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      transition: all 0.4s ease;
    }
    .scroll-top-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* ==========================================================================
       4. INTRO / CURTAIN OVERLAY
       ========================================================================== */
    #curtain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .curtain-title {
      font-family: var(--font-heading);
      color: var(--gold-primary);
      font-size: 2.5rem;
      letter-spacing: 4px;
      opacity: 0;
      margin-bottom: 20px;
    }
    .curtain-sub {
      font-family: var(--font-body);
      color: var(--text-muted);
      font-size: 1rem;
      letter-spacing: 2px;
      opacity: 0;
      margin-bottom: 40px;
    }
